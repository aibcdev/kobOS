<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>KOB google</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #ecece9; }
      #root {
        position: relative; width: 100%; height: 100%;
        font-family: "Instrument Sans", system-ui, sans-serif;
        background: #ecece9; color: #111;
      }
      .stage {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        padding: 72px 64px;
      }
      .stack {
        width: 100%; max-width: 820px;
        display: flex; flex-direction: column; gap: 22px;
        position: relative;
      }
      .stack::before {
        content: "";
        position: absolute; left: 27px; top: 36px; bottom: 36px;
        width: 2px; background: #d4d4d1;
      }
      .bubble {
        position: relative; z-index: 1;
        display: flex; gap: 18px; align-items: flex-start;
        background: #fff; border-radius: 28px; padding: 22px 24px;
        box-shadow: 0 10px 40px -24px rgba(17,17,17,0.35);
      }
      .avatar {
        width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0;
        object-fit: cover; background: #ddd;
      }
      .avatar.orb {
        background:
          radial-gradient(circle at 32% 22%, #b8f0ce 0%, transparent 36%),
          radial-gradient(circle at 50% 48%, #3ecf78 0%, #1f8a4d 44%, #0b3d22 100%);
        box-shadow: inset 0 -8px 14px rgba(6,28,14,0.35);
      }
      .avatar.check {
        display: inline-flex; align-items: center; justify-content: center;
        background: #2f9e5f; color: #fff; font-size: 26px; font-weight: 600;
      }
      .body { min-width: 0; flex: 1; padding-top: 6px; }
      .chip {
        display: inline-block; font-size: 18px; font-weight: 600;
        margin-bottom: 8px; letter-spacing: -0.02em;
      }
      .body p { font-size: 28px; line-height: 1.35; letter-spacing: -0.025em; font-weight: 500; }
      .mark {
        position: absolute; top: 48px; right: 56px;
        font-size: 18px; font-weight: 600; color: #b82e14; letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="role-google" data-start="0" data-width="1080" data-height="1350" data-duration="7">
      <section class="clip stage" data-start="0" data-duration="7">
        <span class="mark">LANGOSTERIA*</span>
        <div class="stack">
          
      <article class="bubble" id="b0">
        <span class="avatar orb"></span>
        <div class="body">
          
          <p>Google says you close at 4pm. The website says 5pm.</p>
        </div>
      </article>

      <article class="bubble" id="b1">
        <img class="avatar" src="assets/owner-face.jpg" alt="" />
        <div class="body">
          
          <p>Set both to 5pm.</p>
        </div>
      </article>

      <article class="bubble" id="b2">
        <span class="avatar check">✓</span>
        <div class="body">
          
          <p>Listing matches</p>
        </div>
      </article>
        </div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#b0", { y: 28, opacity: 0, duration: 0.55, ease: "power3.out" }, 0.35);
      tl.from("#b1", { y: 28, opacity: 0, duration: 0.55, ease: "power3.out" }, 1.7000000000000002);
      tl.from("#b2", { y: 28, opacity: 0, duration: 0.55, ease: "power3.out" }, 3.0500000000000003);
      window.__timelines["role-google"] = tl;
    </script>
  </body>
</html>
